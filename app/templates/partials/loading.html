<div id="global-loading" role="status" aria-live="polite" class="hidden rounded-xl border border-blue-100 bg-blue-50/80 px-4 py-3 text-sm text-blue-800 shadow-sm">
  <div class="flex items-center gap-3">
    <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-blue-600 border-t-transparent"></span>
    <span class="font-medium">{{ loading_text | default('Processing your request, please wait...') }}</span>
  </div>
</div>
